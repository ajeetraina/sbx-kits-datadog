<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3af"/>
    </marker>
  </defs>

  <rect width="1180" height="600" fill="#ffffff"/>

  <!-- Host machine -->
  <rect x="28" y="40" width="945" height="520" rx="26" fill="#e9f1fc" stroke="#7aa7e0" stroke-width="2.5"/>
  <text x="62" y="536" fill="#1e4fa3" font-size="21" font-weight="700">Host machine</text>

  <!-- microVM sandbox -->
  <rect x="70" y="96" width="270" height="352" rx="13" fill="#ffffff" stroke="#6b7787" stroke-width="2"/>
  <text x="90" y="128" fill="#1f2937" font-size="18" font-weight="700">microVM sandbox</text>
  <text x="320" y="128" text-anchor="end" fill="#8a94a6" font-size="13">container</text>

  <!-- container dashed box -->
  <rect x="90" y="144" width="230" height="176" rx="9" fill="none" stroke="#9aa3af" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Agent -->
  <rect x="106" y="160" width="198" height="56" rx="7" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="205" y="194" text-anchor="middle" fill="#2f6fdb" font-size="16" font-weight="700">Agent (any)</text>

  <!-- datadog-ai-guard mixin -->
  <rect x="106" y="232" width="198" height="74" rx="7" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="205" y="258" text-anchor="middle" fill="#2f6fdb" font-size="15" font-weight="700">datadog-ai-guard</text>
  <text x="205" y="277" text-anchor="middle" fill="#6b7280" font-size="11.5">AI Guard SDK (Python + Node)</text>
  <text x="205" y="294" text-anchor="middle" fill="#6b7280" font-size="11.5">kind: mixin</text>

  <!-- DD keys sentinel -->
  <rect x="90" y="334" width="230" height="72" rx="9" fill="#ece7dd" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="205" y="366" text-anchor="middle" fill="#6b6255" font-size="13.5" font-weight="600" font-family="'SF Mono', Menlo, monospace">DD_API_KEY · DD_APP_KEY</text>
  <text x="205" y="387" text-anchor="middle" fill="#8a8272" font-size="13">= proxy-managed</text>

  <!-- sandbox -> proxy -->
  <line x1="340" y1="272" x2="396" y2="272" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="368" y="262" text-anchor="middle" fill="#6b7280" font-size="11">evaluate()</text>

  <!-- Secret store -->
  <rect x="396" y="136" width="200" height="76" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="496" y="168" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="700">Secret store</text>
  <text x="496" y="190" text-anchor="middle" fill="#6b7280" font-size="12">sbx secret set-custom DD_API_KEY</text>
  <line x1="496" y1="212" x2="496" y2="248" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- sbx proxy -->
  <rect x="396" y="250" width="200" height="78" rx="9" fill="#d9f2e4" stroke="#86d6ab" stroke-width="2"/>
  <text x="496" y="284" text-anchor="middle" fill="#1f9d63" font-size="17" font-weight="700">sbx proxy</text>
  <text x="496" y="306" text-anchor="middle" fill="#1f9d63" font-size="13">swaps in keys</text>

  <!-- Egress policy -->
  <rect x="396" y="366" width="200" height="74" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="496" y="398" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="700">Egress policy</text>
  <text x="496" y="420" text-anchor="middle" fill="#6b7280" font-size="12.5">allow-list</text>

  <!-- proxy -> egress (vertical) -->
  <line x1="496" y1="328" x2="496" y2="362" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- proxy -> Datadog AI Guard -->
  <line x1="596" y1="289" x2="988" y2="245" stroke="#9aa3af" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowDash)"/>
  <!-- egress -> registries -->
  <line x1="596" y1="403" x2="988" y2="393" stroke="#9aa3af" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowDash)"/>

  <!-- Datadog AI Guard (external) -->
  <rect x="992" y="208" width="176" height="78" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="1080" y="240" text-anchor="middle" fill="#632ca6" font-size="16" font-weight="700">Datadog AI Guard</text>
  <text x="1080" y="262" text-anchor="middle" fill="#6b7280" font-size="12.5">api.&lt;DD_SITE&gt;</text>

  <!-- Registries (external) -->
  <rect x="992" y="356" width="176" height="74" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="1080" y="388" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="700">PyPI · npm</text>
  <text x="1080" y="410" text-anchor="middle" fill="#6b7280" font-size="12.5">install-time only</text>

  <!-- caption -->
  <text x="992" y="474" fill="#1e4fa3" font-size="16" font-weight="700">Datadog keys never</text>
  <text x="992" y="496" fill="#1e4fa3" font-size="16" font-weight="700">enter the sandbox</text>
  <text x="992" y="524" fill="#3b7fd6" font-size="13.5">Proxy swaps them in at</text>
  <text x="992" y="543" fill="#3b7fd6" font-size="13.5">the network boundary</text>
</svg>
