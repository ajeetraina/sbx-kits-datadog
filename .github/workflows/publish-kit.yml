name: Publish kit

# Publishes the datadog-ai-guard kit to Docker Hub as an OCI artifact.
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME  (e.g. ajeetraina777)
#   DOCKERHUB_TOKEN     (a Docker Hub access token with write access)
#
# Triggers:
#   - manual run (workflow_dispatch), tag defaults to "latest"
#   - push to main -> republishes "latest"
#   - pushing a git tag like v0.1.0 -> publishes "0.1.0" and "latest"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "OCI tag to publish"
        required: false
        default: "latest"
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # keyless Sigstore signing (OIDC) for `sbx kit push --sign`

concurrency:
  group: publish-kit-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_USER: ajeetraina777
  REPO: datadog-ai-guard-kit        # v2 kit (sbx kit push, from the repo root)
  REPO_V3: datadog-ai-guard-kit-v3  # v3 kit (docker buildx, from v3/datadog-ai-guard)

jobs:
  publish:
    # sbx ships as a macOS arm64 cask only, so publish from an Apple-silicon runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sbx CLI
        run: |
          brew install --cask docker/tap/sbx@rc
          sbx version

      - name: Authenticate to Docker Hub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then
            echo "::error::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets." >&2
            exit 1
          fi
          # sbx kit push falls back to the Docker credential store; write it directly
          # so no Docker daemon/CLI is needed on the runner.
          mkdir -p ~/.docker
          auth=$(printf '%s:%s' "$DH_USER" "$DH_TOKEN" | base64)
          printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}\n' "$auth" > ~/.docker/config.json
          # sbx v0.48+ requires its OWN Docker session for `sbx kit validate` (it no
          # longer falls back to ~/.docker/config.json for validate — only push does),
          # failing with "not signed in to Docker / try: sbx login". Establish that
          # session non-interactively from the same token. The sbx-login session also
          # takes priority for push.
          printf '%s' "$DH_TOKEN" | sbx login --username "$DH_USER" --password-stdin

      - name: Resolve tags
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"                       # strip leading v from vX.Y.Z
            echo "tags=$v latest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tags=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=latest" >> "$GITHUB_OUTPUT"          # push to main
          fi

      - name: Publish OCI artifact(s)
        env:
          SIGN: "1"   # keyless Sigstore signature attached as an OCI referrer
        run: |
          chmod +x scripts/push-kit.sh
          for t in ${{ steps.meta.outputs.tags }}; do
            # DOCKERHUB_TOKEN is intentionally unset here: the script then skips
            # `docker login` and uses the ~/.docker/config.json written above.
            ./scripts/push-kit.sh "$t"
          done

      - name: Sync Docker Hub overview
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          chmod +x scripts/update-dockerhub-readme.sh
          ./scripts/update-dockerhub-readme.sh docs/DOCKERHUB.md

  # The v3 kit is a single OCI artifact built by `docker buildx` (the kit
  # frontend is pulled from the descriptor's `# syntax=docker/sandbox-kit:3`
  # line and annotates the image during the build). buildx needs a Docker
  # daemon, so this job runs on Linux — unlike the v2 `publish` job, which runs
  # on macOS only because sbx ships as a macOS cask and `sbx kit push` needs no
  # daemon. Published to a SEPARATE repo ($REPO_V3) so v2 and v3 tags never
  # collide; same triggers as v2 (push to main -> latest, tag vX.Y.Z -> X.Y.Z +
  # latest, manual dispatch -> the chosen tag).
  publish-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation for the multi-arch build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve tags
        id: meta
        run: |
          repo="docker.io/${DOCKERHUB_USER}/${REPO_V3}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"                       # strip leading v from vX.Y.Z
            echo "args=-t $repo:$v -t $repo:latest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "args=-t $repo:${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "args=-t $repo:latest" >> "$GITHUB_OUTPUT"  # push to main
          fi

      - name: Build and push the v3 OCI artifact
        run: |
          docker buildx build v3/datadog-ai-guard \
            -f v3/datadog-ai-guard/datadog-ai-guard.yaml \
            --platform linux/amd64,linux/arm64 \
            --provenance=true \
            --push ${{ steps.meta.outputs.args }}
